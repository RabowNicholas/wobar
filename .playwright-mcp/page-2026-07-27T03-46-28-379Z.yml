    - generic [ref=f89e31]:
      - heading "Let's get your track in front of the right people" [level=1] [ref=f89e32]
      - paragraph [ref=f89e33]: LabelRadar is the most efficient way to get your demo in front of the right people in the electronic music industry. The days of detective work to find emails and fretting over if you’ll hear back or not are over.
      - link "Sign up" [ref=f89e34] [cursor=pointer]:
        - /url: /sign-up
    - generic [ref=f89e36]:
      - heading "How does it work?" [level=1] [ref=f89e37]
      - generic [ref=f89e38]:
        - generic [ref=f89e39]:
          - generic [ref=f89e40]: 
          - generic [ref=f89e42]:
            - heading "STEP 1" [level=5] [ref=f89e43]
            - paragraph [ref=f89e44]: Simply drag and drop your song file to get started.
        - generic [ref=f89e45]:
          - generic [ref=f89e46]: 
          - generic [ref=f89e48]:
            - heading "STEP 2" [level=5] [ref=f89e49]
            - paragraph [ref=f89e50]: Select the best 20 second clip of your song. Enter genre, add collaborators and tags.
        - generic [ref=f89e51]:
          - generic [ref=f89e52]: 
          - generic [ref=f89e54]:
            - heading "STEP 3" [level=5] [ref=f89e55]
            - paragraph [ref=f89e56]: Choose the label you’d like to send it to!
        - generic [ref=f89e57]:
          - generic [ref=f89e58]: 
          - generic [ref=f89e60]:
            - heading "STEP 4" [level=5] [ref=f89e61]
            - paragraph [ref=f89e62]: Get notified immediately when your demo is listened to and start a conversation.
      - generic [ref=f89e63]:
        - generic [ref=f89e64]:
          - generic [ref=f89e65]: 
          - generic [ref=f89e67]:
            - heading "Why 20 seconds?" [level=5] [ref=f89e68]
            - paragraph [ref=f89e69]: Let’s be real, labels don’t have the time to sit and listen through every submission from start to finish, and will often skip randomly through your track. By having you select the 20 second section of your song that you think best represents it, we’re putting the Artist back in the driving seat, so you can ensure that the label hears what you want them to. Then, if they like what they hear, they can listen to the full song, and you’ll be notified every step of the way!
        - generic [ref=f89e70]:
          - generic [ref=f89e71]: 
          - generic [ref=f89e73]:
            - heading "Is it free?" [level=5] [ref=f89e74]
            - paragraph [ref=f89e75]: Every month you will receive free credits to spend on submitting your music. Then if you run out, you can purchase more for just $1. You can also invite friends or upgrade to the PRO membership to increase your monthly credits. You're in control!
    - generic [ref=f89e78]:
      - generic [ref=f89e79]:
        - heading "2 Ways to submit your demo" [level=1] [ref=f89e80]
        - table [ref=f89e82]:
          - rowgroup [ref=f89e83]:
            - row [ref=f89e84]:
              - columnheader "One to Many" [ref=f89e85]
              - columnheader "One to One" [ref=f89e86]
            - row [ref=f89e87]:
              - cell "This is the best option if you want to spread your wings and explore all that LabelRadar has to offer. Your track will be made available to every Label on our platform, allowing you to get an array of responses on your music, however there are no guarantees that they will all listen and it may take longer to get a response, than a One to One submission." [ref=f89e88]
              - cell "This is the best option if you have a Label you think will absolutely love your track and you want to guarantee that they hear it." [ref=f89e89]
